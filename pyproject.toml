[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-barrier-sync"
version = "0.1.0"
description = "Rendezvous barrier and milestone synchronization primitive for multi-agent workflows"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-barrier-sync = "agent_barrier_sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_barrier_sync*"]
